<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #05080a; overflow: hidden; }
  #term { position: absolute; inset: 4px 2px 0 6px; }
  #bottom { position: absolute; right: 14px; bottom: 14px; width: 44px; height: 44px; border-radius: 22px;
            border: 1px solid #5cfded; background: rgba(5,8,10,.85); color: #5cfded; font: 22px sans-serif;
            display: none; align-items: center; justify-content: center; z-index: 10; }
  .xterm .xterm-viewport { background: #05080a !important; }
  /* Double-tap: a see-through copy of the screen's text on top, so Android can select it (handles + Copy bubble). */
  #sel { position: absolute; z-index: 20; margin: 0; padding: 0; white-space: pre; overflow: hidden; color: transparent;
         -webkit-user-select: text; user-select: text; font-kerning: none; }
  #sel::selection { background: rgba(92,253,237,.35); color: transparent; }
</style>
</head>
<body>
<div id="term"></div>
<button id="bottom" aria-label="Jump to the bottom">↓</button>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  // The page only draws. Kotlin owns the connection: Android.* sends, window.ct.* receives.
  const term = new Terminal({
    fontFamily: "'DejaVu Sans Mono', 'Droid Sans Mono', monospace",
    fontSize: Number(Android.fontSize()) || 13,
    scrollback: 20000,
    cursorBlink: true,
    allowProposedApi: true,
    macOptionIsMeta: true,
    theme: {
      background: "#05080a", foreground: "#e6f1f0", cursor: "#5cfded", cursorAccent: "#05080a",
      selectionBackground: "#1f6f68",
      black: "#0b1012", red: "#ff5f6d", green: "#3ef2a5", yellow: "#ffd166", blue: "#5ab0ff",
      magenta: "#d38cff", cyan: "#5cfded", white: "#d7e3e2",
      brightBlack: "#5a6b6e", brightRed: "#ff8a94", brightGreen: "#7dffc4", brightYellow: "#ffe29a",
      brightBlue: "#8cc8ff", brightMagenta: "#e3b2ff", brightCyan: "#9ffff5", brightWhite: "#ffffff",
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));

  const ta = document.querySelector(".xterm-helper-textarea");
  if (ta) { ta.setAttribute("autocapitalize", "off"); ta.setAttribute("autocorrect", "off"); ta.setAttribute("spellcheck", "false"); ta.setAttribute("autocomplete", "off"); }

  term.onData(d => Android.input(d));
  term.onBinary(d => Android.input(d));
  term.onResize(({cols, rows}) => Android.resize(cols, rows));
  term.onTitleChange(t => Android.title(t));

  function refit() { try { fit.fit(); } catch (e) {} }
  new ResizeObserver(refit).observe(document.getElementById("term"));

  function b64bytes(b64) {
    const s = atob(b64), out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  window.ct = {
    write: b64 => term.write(b64bytes(b64)),
    reset: () => term.reset(),
    note: text => term.write("\r\n\x1b[38;2;92;253;237m" + text + "\x1b[0m\r\n"),
    font: size => { term.options.fontSize = size; refit(); },
    focus: () => term.focus(),
    blur: () => term.blur(),
    paste: text => term.paste(text),
    selection: () => term.getSelection(),
    scrollToBottom: () => term.scrollToBottom(),
    // The last `max` lines (scrollback + screen) as plain text, for the select-and-copy view.
    text: max => {
      const buf = term.buffer.active, out = [];
      for (let i = Math.max(0, buf.length - max); i < buf.length; i++) {
        const line = buf.getLine(i);
        const t = line ? line.translateToString(true) : "";
        if (line && line.isWrapped && out.length) out[out.length - 1] += t; else out.push(t);
      }
      while (out.length && !out[out.length - 1].trim()) out.pop();
      return out.join("\n");
    },
  };

  // ---- touch ------------------------------------------------------------------------------------------------------
  // A swipe scrolls (the terminal library has no touch scrolling of its own); full-screen programs (Claude Code, vim,
  // htop, less) get scroll-wheel input or arrow keys instead. Press-and-hold is left alone: Android's own Paste bubble.
  const host = document.getElementById("term");
  const bottomBtn = document.getElementById("bottom");
  let startY = 0, lastY = 0, lastT = 0, acc = 0, velocity = 0, swiping = false, fling = 0;

  function lineHeight() {
    const screen = host.querySelector(".xterm-screen");
    return screen && term.rows ? screen.clientHeight / term.rows : 17;
  }
  function scrollBy(lines) {          // lines < 0: towards older output
    if (!lines) return;
    if (term.buffer.active.type === "normal") { term.scrollLines(lines); return; }
    const up = lines < 0, n = Math.min(Math.abs(lines), 10);
    let seq;
    if (term.modes.mouseTrackingMode !== "none") {
      seq = `\x1b[<${up ? 64 : 65};${Math.floor(term.cols / 2)};${Math.floor(term.rows / 2)}M`;
    } else {
      seq = term.modes.applicationCursorKeysMode ? (up ? "\x1bOA" : "\x1bOB") : (up ? "\x1b[A" : "\x1b[B");
    }
    Android.input(seq.repeat(n));
  }
  host.addEventListener("touchstart", e => {
    cancelAnimationFrame(fling);
    swiping = false;
    if (e.touches.length !== 1) return;
    startY = lastY = e.touches[0].clientY; lastT = performance.now(); acc = 0; velocity = 0;
  }, { passive: true, capture: true });
  host.addEventListener("touchmove", e => {
    if (e.touches.length !== 1) return;
    const y = e.touches[0].clientY, now = performance.now();
    if (!swiping && Math.abs(y - startY) < 10) return;
    swiping = true;
    e.preventDefault(); e.stopPropagation();
    const dy = lastY - y;                 // finger up = positive = newer output
    velocity = dy / Math.max(1, now - lastT);
    lastY = y; lastT = now; acc += dy;
    const h = lineHeight(), lines = Math.trunc(acc / h);
    if (lines) { acc -= lines * h; scrollBy(lines); }
  }, { passive: false, capture: true });
  host.addEventListener("touchend", e => {
    if (!swiping) return;               // a tap or press-and-hold: leave it to the terminal and Android
    e.preventDefault(); e.stopPropagation();
    swiping = false;
    if (term.buffer.active.type !== "normal") return;
    let v = velocity * 16;
    const step = () => {
      if (Math.abs(v) < 0.6) return;
      acc += v; v *= 0.94;
      const h = lineHeight(), lines = Math.trunc(acc / h);
      if (lines) { acc -= lines * h; scrollBy(lines); }
      fling = requestAnimationFrame(step);
    };
    fling = requestAnimationFrame(step);
  }, { passive: false, capture: true });

  function updateBottom() {
    const buf = term.buffer.active;
    bottomBtn.style.display = buf.type === "normal" && buf.viewportY < buf.baseY ? "flex" : "none";
  }
  term.onScroll(updateBottom);
  term.onWriteParsed(updateBottom);
  bottomBtn.addEventListener("click", () => { term.scrollToBottom(); updateBottom(); });

  // What is selected right now: the terminal's own selection, or text selected by Android's press-and-hold.
  window.ct.selected = () => term.getSelection() || String(window.getSelection() || "");

  // ---- double-tap to select ------------------------------------------------------------------------------------------
  let lastTap = 0, lastTapX = 0, lastTapY = 0, sel = null, hadSelection = false;
  function closeSel() { if (sel) { sel.remove(); sel = null; hadSelection = false; } }
  function openSel(x, y) {
    closeSel();
    const screen = host.querySelector(".xterm-screen");
    if (!screen) return;
    const r = screen.getBoundingClientRect(), buf = term.buffer.active, lines = [];
    for (let i = 0; i < term.rows; i++) {
      const line = buf.getLine(buf.viewportY + i);
      lines.push(line ? line.translateToString(true) : "");
    }
    sel = document.createElement("pre");
    sel.id = "sel";
    sel.textContent = lines.join("\n");
    const cellW = r.width / term.cols, cellH = r.height / term.rows;
    Object.assign(sel.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px",
      fontFamily: term.options.fontFamily, fontSize: term.options.fontSize + "px", lineHeight: cellH + "px" });
    document.body.appendChild(sel);
    // line the copy's letters up with the terminal's cells
    const probe = document.createElement("span"); probe.textContent = "M".repeat(50);
    sel.appendChild(probe); const w = probe.getBoundingClientRect().width / 50; probe.remove();
    sel.style.letterSpacing = (cellW - w) + "px";
    Android.selectAt(x, y);            // a real long-press at the spot: Android selects the word with handles
  }
  document.addEventListener("selectionchange", () => {
    if (!sel) return;
    const has = String(window.getSelection() || "").length > 0;
    if (has) hadSelection = true;
    else if (hadSelection) closeSel();   // tapped away or copied: back to the terminal
  });
  host.addEventListener("touchend", e => {
    if (swiping || e.changedTouches.length !== 1) return;
    const t = e.changedTouches[0], now = performance.now();
    if (now - lastTap < 350 && Math.abs(t.clientX - lastTapX) < 40 && Math.abs(t.clientY - lastTapY) < 40) {
      lastTap = 0; e.preventDefault(); openSel(t.clientX, t.clientY);
    } else { lastTap = now; lastTapX = t.clientX; lastTapY = t.clientY; }
  }, { capture: true });
  term.onScroll(closeSel);

  refit();
  Android.ready(term.cols, term.rows);
</script>
</body>
</html>
